<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Соседи России</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10141b;
    color: white;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    padding: 13px 20px;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #475569;
    cursor: not-allowed;
}

.hidden {
    display: none !important;
}

/* ================= ЛОББИ ================= */

#lobby {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.logo {
    font-size: 46px;
    font-weight: bold;
    margin-bottom: 10px;
    text-align: center;
}

.subtitle {
    color: #9ca3af;
    font-size: 19px;
    margin-bottom: 45px;
    text-align: center;
}

.menu {
    width: 360px;
    max-width: 95%;
}

.menu button {
    width: 100%;
    margin-bottom: 15px;
    font-size: 22px;
    padding: 18px;
}

/* ================= МУЛЬТИПЛЕЕР ================= */

#multiplayer {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.mp-box {
    width: 430px;
    max-width: 95%;
    background: #181e28;
    border-radius: 16px;
    padding: 25px;
    text-align: center;
}

.mp-box h1 {
    margin-top: 0;
}

.mp-box input {
    width: 100%;
    background: #252d3a;
    border: 1px solid #475569;
    border-radius: 9px;
    padding: 14px;
    color: white;
    font-size: 18px;
    margin-bottom: 12px;
    text-align: center;
}

.mp-box button {
    width: 100%;
    margin-bottom: 10px;
}

.room-code {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
    background: #252d3a;
    border-radius: 10px;
    padding: 15px;
    margin: 15px 0;
}

.mp-status {
    color: #cbd5e1;
    min-height: 25px;
}

/* ================= ИГРА ================= */

#game {
    min-height: 100vh;
}

.topbar {
    min-height: 70px;
    background: #181e28;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    gap: 10px;
}

.topbar h2 {
    margin: 0;
}

.score {
    font-size: 20px;
    font-weight: bold;
}

.turn {
    background: #334155;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 15px;
}

.game-content {
    padding: 15px;
}

.mode-panel {
    background: #181e28;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

.mode-panel select {
    background: #252d3a;
    color: white;
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 10px;
    font-size: 16px;
    margin-left: 10px;
}

.question {
    background: #181e28;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
}

.question h2 {
    margin-top: 0;
}

#map {
    width: 100%;
    height: 480px;
    border-radius: 12px;
    overflow: hidden;
    background: #dbeafe;
}

.answer-panel {
    background: #181e28;
    border-radius: 12px;
    padding: 18px;
    margin-top: 15px;
}

.inputs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.inputs input {
    flex: 1;
    min-width: 220px;
    background: #252d3a;
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 13px;
    color: white;
    font-size: 17px;
}

#result {
    margin-top: 15px;
    font-size: 19px;
    font-weight: bold;
}

.correct {
    color: #4ade80;
}

.wrong {
    color: #f87171;
}

.mp-observer {
    margin-bottom: 12px;
    padding: 12px;
    border-radius: 9px;
    background: #334155;
    text-align: center;
}

/* ================= ЭНЦИКЛОПЕДИЯ ================= */

#encyclopedia {
    min-height: 100vh;
    padding-bottom: 40px;
}

.ency-header {
    background: #181e28;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.ency-header h1 {
    margin: 0;
}

.filters {
    padding: 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.filters button {
    background: #374151;
}

.filters button.active {
    background: #2563eb;
}

.country-list {
    padding: 0 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
}

.country-card {
    background: #181e28;
    border-radius: 12px;
    padding: 16px;
}

.country-card h3 {
    margin: 0 0 8px;
    font-size: 21px;
}

.country-card p {
    margin: 5px 0;
    color: #cbd5e1;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 7px;
    background: #334155;
    font-size: 13px;
    margin-top: 5px;
}

@media (max-width: 700px) {

    .logo {
        font-size: 35px;
    }

    #map {
        height: 390px;
    }

    .topbar {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<!-- ================= ЛОББИ ================= -->

<div id="lobby">

    <div class="logo">🌍 Соседи России</div>

    <div class="subtitle">
        Географическая игра
    </div>

    <div class="menu">

        <button onclick="openGame()">

        </button>

        <button onclick="openMultiplayer()">

        </button>

        <button onclick="openEncyclopedia()">

        </button>

    </div>

</div>


<!-- ================= МУЛЬТИПЛЕЕР ================= -->

<div id="multiplayer" class="hidden">

    <div class="mp-box">

        <h1>👥 Мультиплеер</h1>

        <p>
            Играйте вдвоём по очереди с одним общим счётом.
        </p>

        <button onclick="createRoom()">

</div>


<!-- ================= ИГРА ================= -->

<div id="game" class="hidden">

    <div class="topbar">

        <button onclick="backToLobby()">
            ← Лобби
        </button>

        <h2>🎮 Игра</h2>

        <div class="score">
            Очки: <span id="score">0</span>
        </div>

        <div
            id="turnIndicator"
            class="turn hidden">
        </div>

    </div>

    <div class="game-content">

        <div class="mode-panel">

            <b>Режим:</b>

            <select
                id="mode"
                onchange="changeMode()">

                <option value="all">
                    Все страны
                </option>

                <option value="first">
                    1-й порядок
                </option>

                <option value="second">
                    2-й порядок
                </option>

                <option value="sea">
                    Морские соседи
                </option>

            </select>

        </div>

        <div
            id="observerPanel"
            class="mp-observer hidden">
        </div>

        <div class="question">

            <h2>📍 Найди страну на карте</h2>

            <div id="questionText">
                Загружаем вопрос...
            </div>

        </div>

        <div id="map"></div>

        <div class="answer-panel">

            <div class="inputs">

                <input
                    id="countryInput"
                    type="text"
                    placeholder="Название страны">

                <input
                    id="capitalInput"
                    type="text"
                    placeholder="Столица">

                <button
                    id="checkButton"
                    onclick="checkAnswer()">

                    Проверить

                </button>

            </div>

            <div id="result"></div>

            <br>

            <button
                id="nextButton"
                class="hidden"
                onclick="nextMultiplayerQuestion()">

                Следующий вопрос →

            </button>

        </div>

    </div>

</div>


<!-- ================= ЭНЦИКЛОПЕДИЯ ================= -->

<div id="encyclopedia" class="hidden">

    <div class="ency-header">

        <button onclick="backToLobby()">
            ← Лобби
        </button>

        <h1>📖 Энциклопедия</h1>

    </div>

    <div class="filters">

        <button
            id="filterAll"
            class="active"
            onclick="setFilter('all')">

            Все

        </button>

        <button
            id="filterFirst"
            onclick="setFilter('first')">

            1-й порядок

        </button>

        <button
            id="filterSecond"
            onclick="setFilter('second')">

            2-й порядок

        </button>

        <button
            id="filterSea"
            onclick="setFilter('sea')">

            Морские

        </button>

    </div>

    <div
        id="countryList"
        class="country-list">
    </div>

</div>

/* =========================================================
   ПЕРЕМЕННЫЕ
   ========================================================= */

let map = null;
let geoData = null;
let currentQuestion = null;
let score = 0;
let currentFilter = "all";
let redMarker = null;


/* =========================================================
   МУЛЬТИПЛЕЕР
   ========================================================= */

let peer = null;
let connection = null;

let multiplayer = false;
let isHost = false;
let myTurn = false;

let roomCode = "";

let syncingMap = false;
let lastMapSend = 0;


/* =========================================================
   НОРМАЛИЗАЦИЯ
   ========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .trim()
        .replace(/ё/g,"е")
        .replace(/й/g,"и")
        .replace(/\s+/g," ");

}


/* =========================================================
   ПЕРЕХОДЫ
   ========================================================= */

function hideAll() {

    document.getElementById("lobby")
        .classList.add("hidden");

    document.getElementById("game")
        .classList.add("hidden");

    document.getElementById("encyclopedia")
        .classList.add("hidden");

    document.getElementById("multiplayer")
        .classList.add("hidden");

}


function backToLobby() {

    hideAll();

    document.getElementById("lobby")
        .classList.remove("hidden");

}


function openGame() {

    multiplayer = false;

    hideAll();

    document.getElementById("game")
        .classList.remove("hidden");

    if (!map) {
        initMap();
    }

    newQuestion();

}


function openEncyclopedia() {

    hideAll();

    document.getElementById("encyclopedia")
        .classList.remove("hidden");

    renderEncyclopedia();

}


function openMultiplayer() {

    hideAll();

    document.getElementById("multiplayer")
        .classList.remove("hidden");

}


/* =========================================================
   КАРТА
   ========================================================= */

function initMap() {

    map = L.map("map", {
        zoomControl:true,
        minZoom:2,
        maxZoom:6
    }).setView([55,40],3);

    map.on("move", sendMapState);
    map.on("zoom", sendMapState);

    loadMap();

}


async function loadMap() {

    try {

        const response = await fetch(
"https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
        );

        geoData = await response.json();

        L.geoJSON(geoData, {

            style:{
                color:"#475569",
                weight:1,
                fillColor:"#cbd5e1",
                fillOpacity:0.75
            },

            onEachFeature:function(feature,layer){

                layer.on("mouseover",function(){

                    layer.setStyle({
                        fillColor:"#93c5fd",
                        fillOpacity:0.9
                    });

                });

                layer.on("mouseout",function(){

                    layer.setStyle({
                        fillColor:"#cbd5e1",
                        fillOpacity:0.75
                    });

                });

            }

        }).addTo(map);

        if (currentQuestion && !multiplayer) {
            showCountry(currentQuestion);
        }

    } catch(error) {

        console.error(error);

        document.getElementById("questionText")
        .textContent =
        "Не удалось загрузить карту. Проверь подключение к интернету.";

    }

}


/* =========================================================
   ПОИСК СТРАНЫ
   ========================================================= */

function findFeature(iso) {

    if (!geoData) return null;

    return geoData.features.find(function(feature){

        const props = feature.properties || {};

        return (
            props.ISO_A3 === iso ||
            props.ADM0_A3 === iso ||
            props.SOV_A3 === iso
        );

    });

}


/* =========================================================
   КРАСНАЯ ТОЧКА
   ========================================================= */

function showCountry(country) {

    const feature = findFeature(country.iso);

    if (!feature) return;

    const point = turf.pointOnFeature(feature);

    const coords = point.geometry.coordinates;

    const lng = coords[0];
    const lat = coords[1];

    if (redMarker) {
        map.removeLayer(redMarker);
    }

    redMarker = L.circleMarker(
        [lat,lng],
        {
            radius:10,
            color:"#991b1b",
            fillColor:"#ef4444",
            fillOpacity:1,
            weight:3
        }
    ).addTo(map);

    if (!syncingMap) {

        map.setView(
            [lat,lng],
            4,
            {animate:true}
        );

    }

}


/* =========================================================
   ВОПРОСЫ
   ========================================================= */

function getAvailableCountries() {

    const mode =
        document.getElementById("mode").value;

    if (mode === "first") {
        return countries.filter(c=>c.order==="first");
    }

    if (mode === "second") {
        return countries.filter(c=>c.order==="second");
    }

    if (mode === "sea") {
        return countries.filter(c=>c.order==="sea");
    }

    return countries;

}


function chooseRandomCountry() {

    const available =
        getAvailableCountries();

    return available[
        Math.floor(
            Math.random()*available.length
        )
    ];

}


function newQuestion(turnOverride) {

    if (multiplayer && !isHost) {
        return;
    }

    currentQuestion =
        chooseRandomCountry();

    document.getElementById("result")
        .textContent="";

    document.getElementById("result")
        .className="";

    document.getElementById("nextButton")
        .classList.add("hidden");

    document.getElementById("countryInput")
        .value="";

    document.getElementById("capitalInput")
        .value="";

    document.getElementById("questionText")
        .textContent =
        "Какая это страна? Назови страну и её столицу.";

    if (geoData) {
        showCountry(currentQuestion);
    }

    if (multiplayer && isHost) {

        sendState({
            type:"question",
            question:currentQuestion,
            score:score,
            turn:(turnOverride || playerRole),
            center:map.getCenter(),
            zoom:map.getZoom()
        });

    }

}


/* =========================================================
   ОТВЕТ
   ========================================================= */

function checkAnswer() {

    if (!currentQuestion) return;

    if (multiplayer && !myTurn) return;

    const countryAnswer =
        normalize(
            document.getElementById("countryInput").value
        );

    const capitalAnswer =
        normalize(
            document.getElementById("capitalInput").value
        );

    const correctCountry =
        normalize(currentQuestion.name);

    const correctCapital =
        normalize(currentQuestion.capital);

    const result =
        document.getElementById("result");

    const nextButton =
        document.getElementById("nextButton");

    const correct =
        countryAnswer === correctCountry &&
        capitalAnswer === correctCapital;

    if (correct) {

        score++;

        document.getElementById("score")
            .textContent=score;

        result.className="correct";

        result.innerHTML =
            "✅ Правильно! " +
            currentQuestion.name +
            " — " +
            currentQuestion.capital;

    } else {

        result.className="wrong";

        result.innerHTML =
            "❌ Неправильно.<br>" +
            "Правильный ответ: <b>" +
            currentQuestion.name +
            " — " +
            currentQuestion.capital +
            "</b>";

    }

    nextButton.classList.remove("hidden");

    if (multiplayer) {

        myTurn=false;

        updateTurnUI();

        sendState({

            type:"answer",

            score:score,

            correct:correct,

            result:
                result.innerHTML

        });

    }

}


/* =========================================================
   СЛЕДУЮЩИЙ ВОПРОС
   ========================================================= */

function nextMultiplayerQuestion() {

    if (!multiplayer) {
        newQuestion();
        return;
    }

    if (!isHost) {

        sendState({
            type:"ready"
        });

        return;

    }

    myTurn = false;

    newQuestion();

}


/* =========================================================
   НОВЫЙ МУЛЬТИПЛЕЕР: WEBSOCKET
   ========================================================= */

let socket = null;
let roomCode = "";
let playerRole = "";
let connected = false;
let suppressNetworkInput = false;

function getSocketUrl(){
    if (location.protocol === "file:") {
        return "ws://localhost:3000";
    }
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    return protocol + "//" + location.host;
}

function setMpStatus(text){
    const el=document.getElementById("mpStatus");
    if(el) el.textContent=text;
}

function sendState(data){
    if(socket && socket.readyState === WebSocket.OPEN){
        socket.send(JSON.stringify(data));
    }
}

function connectSocket(){
    if(socket && (socket.readyState===WebSocket.OPEN || socket.readyState===WebSocket.CONNECTING)) return true;
    try{
        socket=new WebSocket(getSocketUrl());
    }catch(e){
        setMpStatus("Не удалось открыть соединение с сервером.");
        return false;
    }

    socket.onopen=function(){
        connected=true;
        if(roomCode && playerRole){
            sendState({type:"join", room:roomCode, role:playerRole});
        }
    };

    socket.onmessage=function(event){
        try{ handleNetworkMessage(JSON.parse(event.data)); }
        catch(e){ console.error("Network message error",e); }
    };

    socket.onerror=function(e){
        console.error("WebSocket error",e);
        setMpStatus("Ошибка соединения с сервером.");
    };

    socket.onclose=function(){
        connected=false;
        if(multiplayer){
            setMpStatus("Соединение с сервером потеряно.");
        }
    };
    return true;
}

function createRoom(){
    multiplayer=true;
    isHost=true;
    myTurn=true;
    playerRole="host";
    roomCode="";
    setMpStatus("Создаём комнату...");

    const ok=connectSocket();
    if(!ok) return;

    const wait=setInterval(function(){
        if(socket && socket.readyState===WebSocket.OPEN){
            clearInterval(wait);
            sendState({type:"create"});
        }
    },50);
}

function joinRoom(){
    const code=document.getElementById("roomInput").value.trim().toUpperCase();
    if(!code){
        setMpStatus("Введи код комнаты.");
        return;
    }

    multiplayer=true;
    isHost=false;
    myTurn=false;
    playerRole="guest";
    roomCode=code;
    setMpStatus("Подключаемся к комнате...");

    const ok=connectSocket();
    if(!ok) return;

    const wait=setInterval(function(){
        if(socket && socket.readyState===WebSocket.OPEN){
            clearInterval(wait);
            sendState({type:"join",room:roomCode,role:"guest"});
        }
    },50);
}

function startMultiplayerGame(){
    hideAll();
    document.getElementById("game").classList.remove("hidden");
    if(!map) initMap();
    score=0;
    document.getElementById("score").textContent="0";
    updateTurnUI();
}

function handleNetworkMessage(data){
    if(!data) return;

    if(data.type==="roomCreated"){
        roomCode=data.room;
        document.getElementById("roomCode").classList.remove("hidden");
        document.getElementById("roomCode").textContent=roomCode;
        setMpStatus("Передай этот код другу. Ждём подключения...");
        return;
    }

    if(data.type==="joined"){
        roomCode=data.room;
        setMpStatus("Игрок подключён. Запускаем игру...");
        startMultiplayerGame();
        return;
    }

    if(data.type==="roomReady"){
        setMpStatus("Игрок подключился! Игра началась.");
        startMultiplayerGame();
        if(isHost){
            myTurn=true;
            newQuestion();
        }
        return;
    }

    if(data.type==="makeNextQuestion"){
        if(isHost){
            myTurn=(data.turn===playerRole);
            newQuestion(data.turn);
        }
        return;
    }

    if(data.type==="question"){
        currentQuestion=data.question;
        score=data.score;
        document.getElementById("score").textContent=score;
        myTurn=(data.turn===playerRole);
        document.getElementById("questionText").textContent="Какая это страна? Назови страну и её столицу.";
        document.getElementById("countryInput").value="";
        document.getElementById("capitalInput").value="";
        document.getElementById("result").textContent="";
        document.getElementById("result").className="";
        document.getElementById("nextButton").classList.add("hidden");
        updateTurnUI();
        if(geoData) showCountry(currentQuestion);
        if(data.center && map){
            syncingMap=true;
            map.setView([data.center.lat,data.center.lng],data.zoom,{animate:false});
            syncingMap=false;
        }
        return;
    }

    if(data.type==="answer"){
        score=data.score;
        document.getElementById("score").textContent=score;
        document.getElementById("result").innerHTML=data.result;
        document.getElementById("result").className=data.correct?"correct":"wrong";
        myTurn=(data.nextTurn===playerRole);
        updateTurnUI();
        document.getElementById("nextButton").classList.remove("hidden");
        return;
    }

    if(data.type==="map"){
        if(!map) return;
        syncingMap=true;
        map.setView([data.lat,data.lng],data.zoom,{animate:false});
        syncingMap=false;
        return;
    }

    if(data.type==="input"){
        if(myTurn) return;
        suppressNetworkInput=true;
        document.getElementById("countryInput").value=data.country||"";
        document.getElementById("capitalInput").value=data.capital||"";
        suppressNetworkInput=false;
        return;
    }

    if(data.type==="error"){
        setMpStatus(data.message||"Ошибка комнаты.");
        return;
    }

    if(data.type==="left"){
        alert("Друг отключился от комнаты.");
        return;
    }
}

function nextMultiplayerQuestion(){
    if(!multiplayer){ newQuestion(); return; }
    sendState({type:"next"});
}

function sendMapState(){
    if(!multiplayer || !socket || socket.readyState!==WebSocket.OPEN || syncingMap || !map) return;
    const now=Date.now();
    if(now-lastMapSend<80) return;
    lastMapSend=now;
    const center=map.getCenter();
    sendState({type:"map",lat:center.lat,lng:center.lng,zoom:map.getZoom()});
}

function sendInputState(){
    if(suppressNetworkInput || !multiplayer || !myTurn || !socket || socket.readyState!==WebSocket.OPEN) return;
    sendState({
        type:"input",
        country:document.getElementById("countryInput").value,
        capital:document.getElementById("capitalInput").value
    });
}

function updateTurnUI(){
    const indicator=document.getElementById("turnIndicator");
    const observer=document.getElementById("observerPanel");
    const check=document.getElementById("checkButton");
    if(!multiplayer){
        indicator.classList.add("hidden");
        observer.classList.add("hidden");
        check.disabled=false;
        return;
    }
    indicator.classList.remove("hidden");
    if(myTurn){
        indicator.textContent="🟢 Твой ход";
        observer.classList.add("hidden");
        check.disabled=false;
    }else{
        indicator.textContent="👀 Ход друга";
        observer.classList.remove("hidden");
        observer.textContent="👀 Сейчас ходит другой игрок. Ты видишь его действия на карте в реальном времени.";
        check.disabled=true;
    }
}

/* =========================================================
   ПОЛЯ ВВОДА
   ========================================================= */

document.addEventListener(
    "input",
    function(event) {

        if (
            event.target.id==="countryInput" ||
            event.target.id==="capitalInput"
        ) {

            sendInputState();

        }

    }
);

function changeMode() {

    if (multiplayer && !isHost) {
        return;
    }

    newQuestion();

}


/* =========================================================
   ЭНЦИКЛОПЕДИЯ
   ========================================================= */

function setFilter(filter) {

    currentFilter=filter;

    document.querySelectorAll(
        ".filters button"
    ).forEach(function(button){

        button.classList.remove("active");

    });

    if (filter==="all") {
        document.getElementById("filterAll")
            .classList.add("active");
    }

    if (filter==="first") {
        document.getElementById("filterFirst")
            .classList.add("active");
    }

    if (filter==="second") {
        document.getElementById("filterSecond")
            .classList.add("active");
    }

    if (filter==="sea") {
        document.getElementById("filterSea")
            .classList.add("active");
    }

    renderEncyclopedia();

}


function getOrderName(order) {

    if (order==="first") {
        return "1-й порядок";
    }

    if (order==="second") {
        return "2-й порядок";
    }

    return "Морской сосед";

}


function renderEncyclopedia() {

    const list =
        document.getElementById(
            "countryList"
        );

    list.innerHTML="";

    let visible=countries;

    if (currentFilter!=="all") {

        visible=countries.filter(
            c=>c.order===currentFilter
        );

    }

    visible.forEach(function(country){

        const card=
            document.createElement("div");

        card.className="country-card";

        card.innerHTML=`

            <h3>${country.name}</h3>

            <p>
                🏛 Столица:
                <b>${country.capital}</b>
            </p>

            <p>
                🧭 Направление:
                ${country.direction}
            </p>

            <span class="badge">
                ${getOrderName(country.order)}
            </span>

        `;

        list.appendChild(card);

    });

}


/* =========================================================
   ЗАПУСК
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderEncyclopedia();

    }
);

</script>
